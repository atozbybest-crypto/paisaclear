[build]
  # The site is prebuilt and committed, so there is nothing to compile.
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

# Sensible defaults for a static information site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Assets keep their filenames across deploys, so a long cache silently serves
# stale CSS/JS after a release. Revalidate instead: cheap for a site this size.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
