[build]
  # The site is prebuilt and committed, so there is nothing to compile.
  publish = "site"
  # The rebuild workflow commits "chore(build): regenerate site [skip ci]" after
  # every content push. Without this, each push deploys twice — once for your
  # commit and again for the bot's. Exit 0 means "skip this build".
  # Single-quoted (TOML literal string) so the backslashes reach grep intact:
  # in a double-quoted string "\[" is an invalid escape and breaks parsing.
  ignore = 'git log -1 --pretty=%B | grep -q "\[skip ci\]"'

[build.environment]
  PYTHON_VERSION = "3.12"

# Sensible defaults for a static information site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Asset URLs carry a content hash (?v=…), so they can be cached for a year and
# never go stale — a release changes the hash and therefore the URL.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
