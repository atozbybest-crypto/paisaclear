[build]
  # The site is prebuilt and committed, so there is nothing to compile.
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

# Sensible defaults for a static information site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Asset URLs carry a content hash (?v=…), so they can be cached for a year and
# never go stale — a release changes the hash and therefore the URL.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
