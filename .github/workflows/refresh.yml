name: Refresh rates and redeploy

# Runs on GitHub's servers, not your machine. No laptop needs to be on.
# Cloudflare Pages / Netlify redeploy automatically when this pushes a commit.

on:
  schedule:
    # GitHub's free scheduler fires hours late — measured 3 to 7 hours on this
    # repo. One cron therefore lands at an unpredictable time. These four are
    # attempts, not four jobs: the first to run refreshes and the rest exit
    # immediately, so there is still exactly one commit and one deploy a day.
    #   00:30 UTC = 06:00 IST   (the intended slot)
    #   02:30 UTC = 08:00 IST   (if the first was skipped or late)
    #   04:30 UTC = 10:00 IST   (fallback)
    #   06:30 UTC = 12:00 IST   (last chance)
    # The guard reads today's own commit history, so a late run costs seconds.
    - cron: "30 0 * * *"
    - cron: "30 2 * * *"
    - cron: "30 4 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and report without committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if today's refresh already ran
        id: guard
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if git log --since="${TODAY}T00:00:00Z" --grep="chore(rates)" --oneline | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already refreshed today — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Pull RBI rates
        id: refresh
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python refresh_rbi.py

      - name: Refresh fund and ETF NAVs
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/refresh_nav.py

      - name: Pull the day's money headlines
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/fetch_news.py

      - name: Rebuild the site
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python build.py
          python bundle.py

      - name: Check no published rate has gone stale
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_freshness.py

      - name: Commit and push
        if: success() && inputs.dry_run != true && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "paisaclear-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/rates.json site
          if git diff --cached --quiet; then
            echo "No rate changes today."
          else
            git commit -m "chore(rates): refresh $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Tell search engines about the sitemap
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          sleep 120
          python tools/indexnow.py || echo "IndexNow ping skipped"

      - name: Summary
        if: always()
        run: |
          echo "### Rate refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run at: \`$(date -u +'%Y-%m-%d %H:%M UTC')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json,pathlib; r=json.loads(pathlib.Path('content/rates.json').read_text(encoding='utf-8')); print('\n'.join('- ' + k + ': ' + v['value'] + ' (as of ' + v['asOf'] + ')' for k, v in sorted(r['values'].items())))" >> "$GITHUB_STEP_SUMMARY" || true
