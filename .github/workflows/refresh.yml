name: Refresh rates and redeploy

# Runs on GitHub's servers, not your machine. No laptop needs to be on.
# Cloudflare Pages / Netlify redeploy automatically when this pushes a commit.

on:
  # No schedules. This workflow is triggered only from outside — cron-job.org
  # calls the dispatch API at 09:00 and 21:30 IST, which is punctual in a way
  # GitHub's scheduler is not.
  #
  # The GitHub crons were removed on 17 November 2026 because they kept firing
  # at unpredictable hours (measured 3-7 hours late) and one landed shortly
  # before the 09:00 trigger, so the freshness guard treated the day as already
  # refreshed and the morning run did nothing. Exactly two runs a day now.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and report without committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if a refresh ran in the last few hours
        id: guard
        run: |
          # Two refresh windows a day: 09:00 IST (yesterday's close) and 21:30 IST
          # (tonight's NAVs). The window below stops the backup crons from firing
          # again straight after a successful refresh, without blocking the
          # evening run twelve hours later.
          LAST=$(git log -1 --format=%ct --grep="chore(rates)" || true)
          NOW=$(date +%s)
          if [ -n "$LAST" ] && [ $((NOW - LAST)) -lt 18000 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Refreshed $(( (NOW - LAST) / 3600 ))h ago — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Pull RBI rates
        id: refresh
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python refresh_rbi.py

      - name: Refresh fund and ETF NAVs
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/refresh_nav.py

      - name: Pull the day's money headlines
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/fetch_news.py

      - name: Fetch US market data
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/fetch_us_market.py || echo "US market fetch skipped"

      - name: Refresh US funds and ETFs
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/fetch_us_funds.py || echo "US fund fetch skipped"

      - name: Rebuild the AskPaisa index
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/build_askpaisa.py

      - name: Rebuild the site
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python build.py
          python bundle.py

      - name: Check no published rate has gone stale
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_freshness.py

      - name: Commit and push
        if: success() && inputs.dry_run != true && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "paisaclear-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/rates.json content/us_market.json content/us_funds.json site
          if git diff --cached --quiet; then
            echo "No rate changes today."
          else
            git commit -m "chore(rates): refresh $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Tell search engines about the sitemap
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          sleep 120
          python tools/indexnow.py || echo "IndexNow ping skipped"

      - name: Summary
        if: always()
        run: |
          echo "### Rate refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run at: \`$(date -u +'%Y-%m-%d %H:%M UTC')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json,pathlib; r=json.loads(pathlib.Path('content/rates.json').read_text(encoding='utf-8')); print('\n'.join('- ' + k + ': ' + v['value'] + ' (as of ' + v['asOf'] + ')' for k, v in sorted(r['values'].items())))" >> "$GITHUB_STEP_SUMMARY" || true
