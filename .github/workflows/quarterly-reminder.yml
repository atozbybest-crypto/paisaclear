name: Quarterly rate review

# A durable reminder that survives reboots, closed laptops and new sessions:
# it opens a GitHub issue on the first day of each quarter and assigns it to you.
# Close the issue once rates.json is updated.

on:
  schedule:
    # 09:30 IST on 1 January, 1 April, 1 July, 1 October
    - cron: "0 4 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open the quarterly review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          quarter="Q$(( ($(date -u +%-m) - 1) / 3 + 1 ))"
          title="Quarterly: review small-savings rates ($quarter $(date -u +%Y))"

          if gh issue list --search "$title in:title" --state all --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Issue already exists for this quarter; nothing to do."
            exit 0
          fi

          body=$(cat <<'EOF'
          The quarterly small-savings notification is due. These rates are entered by hand
          because the National Savings Institute page is not machine-readable.

          **Schemes:** PPF, NSC, SSY, SCSS, KVP, MIS, 5-year Post Office TD

          - [ ] Read the latest notification (NSI / India Post, or reporting of it)
          - [ ] Update `content/rates.json` — `value`, `asOf`, `confirmedVia`
          - [ ] `python refresh_rbi.py --dry-run`
          - [ ] `python build.py && python bundle.py`
          - [ ] `python tools/check_freshness.py` passes
          - [ ] Push, confirm the deploy

          The daily refresh workflow will start failing its freshness check once a
          value passes its 100-day window, until this is done.
          EOF
          )

          gh issue create --title "$title" --body "$body" --assignee "$ASSIGNEE" || \
          gh issue create --title "$title" --body "$body"
